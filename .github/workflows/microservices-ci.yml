name: Microservices CI

on:
  pull_request:
    branches: [main, microservices]
    paths: &ci-paths
      - 'Services/shared/contracts/**'
      - 'Services/lead-service/**'
      - 'Services/billing-service/**'
      - 'Services/package-service/**'
      - 'Management/**'
      - '.github/workflows/microservices-ci.yml'
  push:
    branches: [main, microservices]
    paths: *ci-paths

env:
  NODE_VERSION: '20.x'

jobs:
  contracts:
    name: shared/contracts tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Services/shared/contracts/package-lock.json

      - name: Install
        working-directory: Services/shared/contracts
        run: npm ci

      - name: Lint
        working-directory: Services/shared/contracts
        run: npm run lint

      - name: Test
        working-directory: Services/shared/contracts
        run: npm test

  lead-service:
    name: lead-service tests
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            Services/shared/contracts/package-lock.json
            Services/lead-service/package-lock.json

      # lead-service depends on @travel-crm/contracts via a `file:` link, so
      # the shared package's own node_modules must exist before `npm ci` here
      # can resolve it — these are independent npm projects, no workspace.
      - name: Install shared/contracts
        working-directory: Services/shared/contracts
        run: npm ci

      - name: Install lead-service
        working-directory: Services/lead-service
        run: npm ci

      - name: Lint
        working-directory: Services/lead-service
        run: npm run lint

      - name: Test
        working-directory: Services/lead-service
        run: npm test

  billing-service:
    name: billing-service tests
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            Services/shared/contracts/package-lock.json
            Services/billing-service/package-lock.json

      - name: Install shared/contracts
        working-directory: Services/shared/contracts
        run: npm ci

      - name: Install billing-service
        working-directory: Services/billing-service
        run: npm ci

      - name: Lint
        working-directory: Services/billing-service
        run: npm run lint

      - name: Test
        working-directory: Services/billing-service
        run: npm test

  management:
    name: Management tests
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            Services/shared/contracts/package-lock.json
            Management/package-lock.json

      - name: Install shared/contracts
        working-directory: Services/shared/contracts
        run: npm ci

      # --legacy-peer-deps works around a pre-existing, unrelated conflict
      # between this package's vite version and @vitejs/plugin-react's peer
      # range. Not introduced by this workflow — remove once that's fixed.
      - name: Install Management
        working-directory: Management
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: Management
        run: npm run lint

      - name: Test
        working-directory: Management
        run: npm test

  package-service:
    name: package-service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Services/package-service/package-lock.json

      - name: Install
        working-directory: Services/package-service
        run: npm ci

      - name: Lint
        working-directory: Services/package-service
        run: npm run lint

      # test:ci excludes the two hotels.*.live.*.test.js suites, which hit
      # the real LiteAPI service and require LITEAPI_API_KEY — not something
      # to run against a paid third-party API on every CI push.
      - name: Test
        working-directory: Services/package-service
        run: npm run test:ci

  ci-status:
    name: Microservices CI Status
    runs-on: ubuntu-latest
    needs: [contracts, lead-service, billing-service, package-service, management]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.contracts.result }}" != "success" ] || \
             [ "${{ needs.lead-service.result }}" != "success" ] || \
             [ "${{ needs.billing-service.result }}" != "success" ] || \
             [ "${{ needs.package-service.result }}" != "success" ] || \
             [ "${{ needs.management.result }}" != "success" ]; then
            echo "Microservices CI failed"
            exit 1
          fi
          echo "Microservices CI passed"
